name: Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - name: Refresh the contributors and their avatars
        # Never fatal: site/data/contributors.json and site/static/contributors/
        # are committed, so a GitHub hiccup ships the last known list rather
        # than failing the deploy.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: ./site/refresh-contributors.sh
      - name: Configure Pages (enable if needed)
        uses: actions/configure-pages@v6
        with:
          enablement: true
      - uses: taiki-e/install-action@v2.87.6
        with:
          tool: zola@0.19.2
      - name: Build site
        run: cd site && zola build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/public

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
